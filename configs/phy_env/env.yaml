defaults:
  - policy: llm_json
  - observation: height_map_image
  - scoring: compactness
  - _self_

env:
  seed: null

  object_dataset_dir: data_engine/object_datasets

  buffer:
    shuffle_visible_objects: true

  container:
    # Grid units are centimeters.
    xy_cell_cm: 2.5
    z_cell_cm: 0.2
    show_wall: true
    height_map_color_norm_container_ratio: 2.0

  hz: 240

  settle_steps: 240

  max_settle_steps: 960
  settle_velocity_threshold: 0.01

  render: false
  render_aa_scale: 1
  save_visualization: false
  save_video: true
  visualization_dir: outputs/visualization
  visualization_max_episodes: null

  termination:
    enable_early_stop: true
    max_consecutive_fails: 3
